name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  study:
    name: Compile, lint and reproduce the Monte-Carlo study
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy matplotlib pytest ruff

      - name: Byte-compile every module
        run: python -m compileall -q kalman_missile_sim.py radar_3d_sim.py radar_demo_fixed_visible.py tests

      - name: Lint for syntax and runtime-breaking errors
        run: ruff check --select E9 .

      - name: Reproduce the Monte-Carlo study (headless)
        env:
          MPLBACKEND: Agg
        run: python kalman_missile_sim.py

      - name: Run the test suite
        env:
          MPLBACKEND: Agg
        run: pytest -q

      - name: Check that the figure was regenerated
        run: test -s results/kalman_missile_intercept.png

      - name: Upload the regenerated figure
        uses: actions/upload-artifact@v4
        with:
          name: monte-carlo-figure-py${{ matrix.python-version }}
          path: results/kalman_missile_intercept.png
          if-no-files-found: error
